<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumple 23 de Vicente</title>
<meta name="description" content="Fiesta de disfraces. Sábado 31 de octubre, 21:30 hs, en casa. Confirmá por WhatsApp.">
<meta name="theme-color" content="#e8e1d5">
<meta property="og:type" content="website">
<meta property="og:title" content="Vicente 23 · Fiesta de disfraces">
<meta property="og:description" content="Sábado 31 de octubre, 21:30 hs, en casa. Disfraz libre.">
<meta property="og:url" content="https://vicent301.github.io/Cumpleanos-vicente/">
<meta property="og:image" content="https://vicent301.github.io/Cumpleanos-vicente/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="assets/invitacion.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --papel: #e8e1d5;
    --papel-2: #f3eee5;
    --azul: #1d3461;
    --rojo: #b8322a;
    --tinta: #1c1f26;
    --gris: #6d665c;
    --mono: "Courier Prime", "Courier New", monospace;
    --marca: "Permanent Marker", "Comic Sans MS", cursive;
    --texto: "Familjen Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--texto);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 480px; margin: 0 auto; }
  .afiche { display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1919; background: var(--papel); }

  .datos {
    position: relative; margin: -28px 16px 0; padding: 22px 20px 20px;
    background: var(--papel-2); border-radius: 4px; transform: rotate(-1deg);
    box-shadow: 0 10px 24px rgba(40,30,20,.18), 0 1px 0 rgba(0,0,0,.05);
  }
  .datos::before { /* cinta */
    content: ""; position: absolute; top: -12px; left: 50%; width: 96px; height: 24px; margin-left: -48px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.08); transform: rotate(2deg);
  }
  .datos h1 { font: 400 1.7rem/1.05 var(--marca); color: var(--azul); margin: 0 0 14px; text-align: center; }
  .fila-dato { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px dashed rgba(29,52,97,.3); }
  .fila-dato dt { font: 700 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
  .fila-dato dd { margin: 0; font: 700 1.12rem/1.2 var(--mono); color: var(--azul); text-align: right; }
  dl { margin: 0; }
  .cuenta { margin: 12px 0 0; text-align: center; font: 600 .95rem/1.3 var(--texto); color: var(--gris); }
  .cuenta strong { color: var(--rojo); }

  .acciones { display: grid; gap: 10px; padding: 26px 16px 34px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 700 1rem/1 var(--texto); text-decoration: none; text-align: center;
    padding: 16px; border-radius: 12px; border: 2px solid var(--azul); color: var(--azul); background: transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn-wsp { background: var(--azul); color: #fff; font-size: 1.12rem; padding: 19px 16px; box-shadow: 0 6px 0 #0f1f3d; margin-bottom: 6px; }
  .btn-wsp:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f1f3d; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn:focus-visible { outline: 3px solid var(--rojo); outline-offset: 3px; }
  .pie { text-align: center; font: 400 .8rem/1.4 var(--mono); color: var(--gris); padding: 0 16px 28px; margin: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tinta); color: #fff; font: 600 .9rem/1 var(--texto); padding: 12px 16px; border-radius: 99px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="assets/invitacion.webp" type="image/webp">
    <img class="afiche" src="assets/invitacion.jpg" width="1080" height="1919"
         alt="Invitación: Vicente 23, Happy Birthday. Foto de Vicente de chico con gorrito de cumple. 31 de octubre, fiesta de disfraces.">
  </picture>

  <section class="datos" aria-labelledby="t-datos">
    <h1 id="t-datos">Fiesta de disfraces</h1>
    <dl>
      <div class="fila-dato"><dt>Cuándo</dt><dd>Sáb 31/10 · 21:30 hs</dd></div>
      <div class="fila-dato"><dt>Dónde</dt><dd>Mi casa · Pilar</dd></div>
      <div class="fila-dato"><dt>Disfraz</dt><dd>Libre (obligatorio)</dd></div>
    </dl>
    <p class="cuenta" id="cuenta"></p>
  </section>

  <div class="acciones">
    <a class="btn btn-wsp" id="btn-wsp" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>
      Confirmo por WhatsApp</a>
    <div class="dos">
      <a class="btn" id="btn-mapa" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        Cómo llegar</a>
      <a class="btn" id="btn-agenda" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Agendar</a>
    </div>
    <button class="btn" id="btn-compartir" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      Compartir invitación</button>
  </div>
  <p class="pie">Vicente · 31.10.2026</p>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
  // ====== Datos del cumple ======
  const CONFIG = {
    fecha: '2026-10-31T21:30:00-03:00',
    horas: 5,                                   // duración para el calendario
    lugar: 'Casa de Vicente, Pilar, Córdoba',
    mapa: 'https://maps.app.goo.gl/QRNJ9CypNrPaN4zCA',
    whatsapp: '5493572534546',                  // con código de país, sin +
    mensaje: '¡Vicente! Voy a tu cumple de disfraces el sábado 31 🎭'
  };

  const $ = (id) => document.getElementById(id);
  const inicio = new Date(CONFIG.fecha);
  const fin = new Date(inicio.getTime() + CONFIG.horas * 3600e3);
  const utc = (d) => d.toISOString().replace(/[-:]|\.\d{3}/g, '');

  $('btn-wsp').href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(CONFIG.mensaje);
  $('btn-mapa').href = CONFIG.mapa;
  $('btn-agenda').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Cumple 23 de Vicente · Fiesta de disfraces')
    + '&dates=' + utc(inicio) + '/' + utc(fin)
    + '&location=' + encodeURIComponent(CONFIG.lugar)
    + '&details=' + encodeURIComponent('Disfraz libre. Ubicación: ' + CONFIG.mapa);

  // Cuenta regresiva en días
  const dias = Math.ceil((inicio - Date.now()) / 864e5);
  $('cuenta').innerHTML = Date.now() > fin.getTime() ? 'Gracias por venir.'
    : Date.now() >= inicio.getTime() ? '<strong>Es ahora.</strong> Vení.'
    : dias <= 1 ? '<strong>¡Es mañana!</strong> Andá preparando el disfraz.'
    : 'Faltan <strong>' + dias + ' días</strong>. Andá pensando el disfraz.';
  if (dias === 0 && Date.now() < inicio.getTime()) $('cuenta').innerHTML = '<strong>¡Es hoy!</strong> Nos vemos a las 21:30.';

  let tt;
  function toast(m) { const el = $('toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2200); }
  $('btn-compartir').addEventListener('click', async () => {
    const url = location.href.split('#')[0];
    if (navigator.share) {
      try { await navigator.share({ title: 'Cumple 23 de Vicente', text: 'Fiesta de disfraces 🎭 sábado 31/10', url }); } catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch (e) { toast(url); }
    }
  });
</script>
</body>
</html>
