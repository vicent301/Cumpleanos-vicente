<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicente 23 · Después de las 00:30</title>
<meta name="description" content="Cumplo 23 y después de las 00:30 se arma. Sábado 31 a la noche, en mi casa. Fiesta de disfraces.">
<meta name="theme-color" content="#d3cabf">
<link rel="preload" as="image" href="assets/afiche-ia.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kalam:wght@700&family=Archivo+Black&family=Abril+Fatface&family=Familjen+Grotesk:wght@600;700&display=swap">
<style>
  :root {
    --papel: #d3cabf;
    --crema: #f1ebe0;
    --azul: #1d3a7a;
    --azul-osc: #11265a;
    --tinta: #1c1f26;
    --gris: #6d665c;
    --mono: "Courier Prime", "Courier New", monospace;
    --mano: "Kalam", "Comic Sans MS", cursive;
    --texto: "Familjen Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--tinta); font-family: var(--texto); background: var(--papel) url("assets/papel-ia.webp") 0 0 / 300px auto repeat; overflow-x: hidden; }
  main { max-width: 480px; margin: 0 auto; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* Afiche de arriba: se funde con el papel de abajo */
  .afiche img { display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1440;
    -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }

  .abajo { position: relative; margin-top: -26px; padding: 0 20px 34px; }
  .lentejuelas { position: absolute; left: 0; top: -40px; width: 64px; height: 300px; background: url("assets/lentejuelas.webp") right top / cover;
    border-radius: 0 60px 70px 0 / 0 150px 150px 0; opacity: .95; pointer-events: none; }
  .lentejuelas.der { left: auto; right: 0; top: 470px; width: 52px; height: 240px; border-radius: 60px 0 0 70px / 140px 0 0 140px; transform: scaleX(-1); }

  .fecha { position: relative; text-align: center; font: 400 2.1rem/1 var(--mono); color: var(--azul); margin: 0; letter-spacing: .01em; }
  .fecha small { display: block; font: 700 .95rem/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; margin-bottom: 8px; }

  /* Letras recortadas tipo nota de rescate, como "Vicente" y "HAPPY BIRTHDAY" */
  .recortes { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin: 22px 0 0; }
  .palabra { display: flex; gap: 2px; }
  .l { display: inline-grid; place-items: center; min-width: 1.05em; padding: .08em .1em .02em; font-size: 2.15rem; line-height: 1;
    border-radius: 2px; box-shadow: 0 0 0 3px #fbf8f2, 0 3px 5px 2px rgba(50,35,20,.28); }
  .chico .l { font-size: 1.45rem; }

  .lugar { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 26px 0 0; font: 700 2.1rem/1 var(--mano); color: #2346a6; }
  .lugar img { width: 38px; height: auto; transform: rotate(-8deg); }
  .lugar span { display: inline-block; transform: rotate(-2deg); }

  .pincel { display: block; width: calc(100% + 16px); max-width: none; height: auto; margin: 12px -8px 0; aspect-ratio: 650 / 160;
    -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent); mask-image: radial-gradient(closest-side, #000 82%, transparent); }

  .nota { position: relative; width: fit-content; margin: 8px auto 0; padding: 12px 18px 10px; background: var(--crema); transform: rotate(-2deg);
    font: 700 1.2rem/1.25 var(--mano); color: #2346a6; text-align: center; box-shadow: 0 4px 10px rgba(50,35,20,.22); }
  .nota::before { content: ""; position: absolute; top: -11px; left: 50%; width: 74px; height: 22px; margin-left: -37px; background: rgba(255,255,255,.55); transform: rotate(3deg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .cuenta { position: relative; margin: 18px 0 0; text-align: center; font: 700 .9rem/1.3 var(--mono); color: var(--gris); }
  .cuenta strong { color: var(--azul); }

  /* Botones como papeles pegados */
  .acciones { position: relative; display: grid; gap: 16px; margin-top: 26px; }
  .btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; text-align: center; cursor: pointer;
    font: 700 1rem/1 var(--mono); color: var(--azul); background: var(--crema); border: 0; padding: 17px 10px;
    box-shadow: 0 4px 10px rgba(50,35,20,.22); -webkit-tap-highlight-color: transparent; transition: transform .12s; }
  .btn svg { width: 21px; height: 21px; flex: none; }
  .btn::before { content: ""; position: absolute; top: -9px; left: 50%; width: 56px; height: 18px; margin-left: -28px; background: rgba(255,255,255,.55); transform: rotate(-4deg); }
  .btn-wsp { font: 700 1.2rem/1 var(--texto); color: #fff; background: var(--azul); padding: 21px 12px; transform: rotate(-1.2deg);
    clip-path: polygon(0 6%, 4% 0, 12% 5%, 22% 1%, 33% 6%, 45% 0, 57% 5%, 69% 1%, 80% 6%, 91% 0, 100% 5%, 99% 95%, 92% 100%, 81% 95%, 70% 100%, 58% 94%, 46% 100%, 34% 95%, 22% 100%, 11% 94%, 2% 100%); }
  .btn-wsp::before { display: none; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .dos .btn:first-child { transform: rotate(1.5deg); }
  .dos .btn:last-child { transform: rotate(-1.8deg); }
  #btn-compartir { transform: rotate(.8deg); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #c8241c; outline-offset: 3px; }
  .pie { position: relative; text-align: center; font: 400 .8rem/1.4 var(--mono); color: var(--gris); margin: 30px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tinta); color: #fff; font: 600 .9rem/1 var(--texto); padding: 12px 16px; border-radius: 99px; z-index: 5; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="afiche">
    <picture>
      <source srcset="assets/afiche-ia.webp" type="image/webp">
      <img src="assets/afiche-ia.jpg" width="1080" height="1440" alt="Collage: Vicente 23, Happy Birthday. Foto de Vicente de chico con gorrito de cumple, bolas de disco, globos y un cartel de prohibido venir sin disfraz.">
    </picture>
  </div>

  <div class="abajo">
    <div class="lentejuelas" aria-hidden="true"></div>
    <div class="lentejuelas der" aria-hidden="true"></div>

    <p class="fecha"><small>Sábado</small>31 Octubre</p>

    <h1 class="recortes" id="recortes"><span class="sr">Después de las 00:30</span></h1>

    <p class="lugar"><img src="assets/chinche.webp" width="68" height="82" alt=""><span>Mi casa</span></p>

    <img class="pincel" src="assets/pincel.webp" width="650" height="160" alt="Fiesta de disfraces">

    <p class="nota">Cumplo 23 y a la noche se arma.<br>Disfraz sí o sí.</p>
    <p class="cuenta" id="cuenta"></p>

    <div class="acciones">
      <a class="btn btn-wsp" id="btn-wsp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>
        Confirmo por WhatsApp</a>
      <div class="dos">
        <a class="btn" id="btn-mapa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          Cómo llegar</a>
        <a class="btn" id="btn-agenda" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Agendar</a>
      </div>
      <button class="btn" id="btn-compartir" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        Compartir invitación</button>
    </div>
    <p class="pie">Vicente · 31.10.2026 · 00:30</p>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
  // Letras recortadas: cada una con su papel, su tipografía y su inclinación (siempre las mismas)
  const papeles = [['#d98a3d', '#3b1610'], ['#9fd3cb', '#5a1631'], ['#7d1f3d', '#f6e9d6'], ['#efe3c4', '#1d3a7a'], ['#e9a7b6', '#1b1b1b'],
                   ['#2b3f7c', '#fff'], ['#f4f0e6', '#8a1d1d'], ['#6c5b9e', '#fff'], ['#e5c84b', '#1b1b1b'], ['#b9d27a', '#5a1631']];
  const fuentes = ['"Archivo Black", Impact, sans-serif', '"Abril Fatface", Georgia, serif', '"Courier Prime", monospace', 'Georgia, serif', '"Archivo Black", Impact, sans-serif'];
  const giros = [-6, 4, -2, 7, -4, 2, -7, 5, -3, 6, -5, 3];
  let n = 0;
  const caja = document.getElementById('recortes');
  [['DESPUÉS', ''], ['DE', 'chico'], ['LAS', 'chico'], ['00:30', '']].forEach(([palabra, clase]) => {
    const w = document.createElement('span'); w.className = 'palabra ' + clase; w.setAttribute('aria-hidden', 'true');
    for (const c of palabra) {
      const l = document.createElement('span'); l.className = 'l'; l.textContent = c;
      const [fondo, color] = papeles[(n * 7) % papeles.length];
      l.style.cssText = `background:${fondo};color:${color};font-family:${fuentes[(n * 3) % fuentes.length]};transform:rotate(${giros[n % giros.length]}deg) translateY(${(n % 3) - 1}px)`;
      w.appendChild(l); n++;
    }
    caja.appendChild(w);
  });
</script>
<script src="despues.js"></script>
</body>
</html>
